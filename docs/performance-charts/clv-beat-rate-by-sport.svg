<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="335" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="24" y="34" font-size="19" font-weight="800" fill="#14161C">Closing line value: % of picks that beat the close</text>
  <text x="24" y="52" font-size="12.5" fill="#5B6472">The metric professionals trust over win rate -- knowable at bet time, not after the game (80 picks with a real closing match).</text>

  <g transform="translate(0,10)">
    <line x1="488" y1="60" x2="488" y2="264" stroke="#B97A1F" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="488" y="278" font-size="10.5" text-anchor="middle" fill="#B97A1F" font-weight="700">60% benchmark</text>

    <!-- tennis_atp 66.7% n=45 -->
    <text x="20" y="78" font-size="12.5" font-weight="700" fill="#14161C">ATP tennis</text>
    <rect x="170" y="64" width="353.5" height="20" rx="4" fill="#0ca30c"/>
    <text x="533" y="78" font-size="12.5" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#006300">66.7% (n=45)</text>

    <!-- tennis_wta 68.0% n=25 -->
    <text x="20" y="118" font-size="12.5" font-weight="700" fill="#14161C">WTA tennis</text>
    <rect x="170" y="104" width="360.4" height="20" rx="4" fill="#0ca30c"/>
    <text x="540" y="118" font-size="12.5" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#006300">68.0% (n=25)</text>

    <!-- mlb 28.6% n=7 -->
    <text x="20" y="158" font-size="12.5" font-weight="600" fill="#5B6472">MLB</text>
    <rect x="170" y="144" width="151.6" height="20" rx="4" fill="#d03b3b" opacity="0.55"/>
    <text x="331" y="158" font-size="12.5" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#d03b3b">28.6% (n=7, too small)</text>

    <!-- ufc 0% n=2 -->
    <text x="20" y="198" font-size="12.5" font-weight="600" fill="#5B6472">UFC</text>
    <rect x="170" y="184" width="2" height="20" rx="1" fill="#d03b3b" opacity="0.55"/>
    <text x="182" y="198" font-size="12.5" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#d03b3b">0.0% (n=2, too small)</text>

    <!-- leagues_cup 100% n=1 -->
    <text x="20" y="238" font-size="12.5" font-weight="600" fill="#5B6472">Leagues Cup</text>
    <rect x="170" y="224" width="530" height="20" rx="4" fill="#0ca30c" opacity="0.55"/>
    <text x="712" y="238" font-size="12.5" font-weight="700" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#006300">100% (n=1, too small)</text>
  </g>

  <text x="24" y="300" font-size="11.5" fill="#B97A1F" font-weight="700">Overall: 62.5% beat close (n=80) -- inside the 60-65%+ range research cites as a real-edge signal.</text>
  <text x="24" y="317" font-size="11.5" fill="#B97A1F" font-weight="700">Tennis specifically carries this; MLB/UFC/Leagues Cup are far too small to read yet.</text>
</svg>
